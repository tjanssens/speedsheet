[package]
name = "speedsheet-core"
description = "UI-independent spreadsheet core for SpeedSheet: file IO, formulas, sort, filter, search, undo."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
calamine = { version = "0.38", features = ["dates"] }
rust_xlsxwriter = { version = "0.104", features = ["constant_memory", "ryu"] }
csv = "1.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
