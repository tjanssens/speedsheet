[package]
name = "speedsheet-core"
description = "UI-independent spreadsheet core for SpeedSheet: file IO, formulas, sort, filter, search, undo."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
calamine = { version = "0.38", features = ["dates"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rust_xlsxwriter = { version = "0.104", features = ["constant_memory", "ryu"] }
csv = "1.3"
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
