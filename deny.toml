# cargo-deny: known vulnerabilities (RustSec), licenses, and where crates come from.
[graph]
all-features = false

[advisories]
# Unmaintained crates deep in Tauri's GTK stack are not ours to replace; vulnerabilities still fail.
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # chrono is marked unmaintained (no vulnerability). calamine depends on it too, so dropping it
  # from speedsheet-core alone would not remove it. Revisit when calamine moves to jiff or time.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained notice only; also required by calamine" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "BSL-1.0", "0BSD", "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
