# Monthly, grouped dependency updates: one PR per ecosystem, so updates stay reviewable.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    groups:
      rust: { patterns: ["*"], update-types: [minor, patch] }
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups:
      npm: { patterns: ["*"], update-types: [minor, patch] }
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
