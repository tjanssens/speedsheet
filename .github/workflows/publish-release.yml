name: Publish release

# Publish an existing draft release by tag (for drafts made before Release published itself).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the draft release, e.g. v0.3.1"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest --target "$GITHUB_SHA"
