<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpeedSheet</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar" role="toolbar" aria-label="Main toolbar">
        <div class="brand" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M13 2 4 14h6l-1 8 9-12h-6z" fill="currentColor"/></svg>
          <span>SpeedSheet</span>
        </div>
        <div class="group">
          <button data-cmd="new" title="New (Ctrl+N)"><svg viewBox="0 0 24 24"><path d="M6 2h8l5 5v15H6zM14 2v5h5"/></svg><span>New</span></button>
          <button data-cmd="open" title="Open (Ctrl+O)"><svg viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/></svg><span>Open</span></button>
          <button data-cmd="save" title="Save (Ctrl+S)"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5zM8 3v5h7V3M8 21v-7h8v7"/></svg><span>Save</span></button>
          <button data-cmd="saveAs" title="Save as (Ctrl+Shift+S)" class="icon-only"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v6M5 3v18h7M8 3v5h7V3M15 21l6-6-2-2-6 6v2z"/></svg></button>
        </div>
        <div class="group">
          <button data-cmd="undo" title="Undo (Ctrl+Z)" class="icon-only"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
          <button data-cmd="redo" title="Redo (Ctrl+Y)" class="icon-only"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
        </div>
        <div class="group">
          <button data-cmd="sortAsc" title="Sort A to Z by the selected column"><svg viewBox="0 0 24 24"><path d="M7 4v16m0 0-3-3m3 3 3-3M14 4h6l-6 7h6M14 14h6M15 20l2-6 2 6"/></svg><span>A→Z</span></button>
          <button data-cmd="sortDesc" title="Sort Z to A by the selected column"><svg viewBox="0 0 24 24"><path d="M7 20V4m0 0L4 7m3-3 3 3M14 4h6l-6 7h6M14 14h6M15 20l2-6 2 6"/></svg><span>Z→A</span></button>
          <button data-cmd="filter" title="Filter: add or remove filter buttons on the header row (Ctrl+Shift+L)"><svg viewBox="0 0 24 24"><path d="M3 4h18l-7 9v6l-4 2v-8z"/></svg><span>Filter</span></button>
          <button data-cmd="clearFilters" title="Clear all filters" class="icon-only" disabled><svg viewBox="0 0 24 24"><path d="M3 4h18l-7 9v6l-4 2v-8zM16 16l5 5m0-5-5 5"/></svg></button>
        </div>
        <div class="group">
          <button data-cmd="find" title="Find (Ctrl+F)" class="icon-only"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg></button>
          <button data-cmd="print" title="Print or save as PDF (Ctrl+P)" class="icon-only"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4v-8h16v8h-2M7 14h10v7H7z"/></svg></button>
        </div>
        <div class="spacer"></div>
        <button data-cmd="theme" title="Appearance: light, dark or light sheet" class="icon-only"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
        <button data-cmd="updates" title="Check for updates" class="icon-only"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
        <button data-cmd="feedback" class="feedback-btn" title="Send feedback to the developer"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4z"/></svg><span>Feedback</span></button>
      </header>

      <div class="formula-bar">
        <input id="name-box" aria-label="Cell address" spellcheck="false" />
        <span class="fx" aria-hidden="true">fx</span>
        <input id="formula-input" aria-label="Cell contents" spellcheck="false" autocomplete="off" />
      </div>

      <main id="grid-host">
        <div id="scroller" tabindex="0" aria-label="Spreadsheet grid"><div id="spacer"></div></div>
        <canvas id="grid-canvas"></canvas>
        <textarea id="cell-editor" spellcheck="false" hidden></textarea>
        <div id="find-bar" class="floating" hidden>
          <input id="find-input" placeholder="Find" aria-label="Find" spellcheck="false" />
          <label class="chk"><input type="checkbox" id="find-all" checked /> All sheets</label>
          <button id="find-prev" title="Previous (Shift+Enter)" class="icon-only"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
          <button id="find-next" title="Next (Enter)" class="icon-only"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
          <button id="find-close" title="Close (Esc)" class="icon-only"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
          <span id="find-status"></span>
        </div>
        <div id="busy" hidden><div class="spinner"></div><span id="busy-text">Working…</span></div>
      </main>

      <footer class="bottom">
        <div id="tabs" role="tablist" aria-label="Sheets"></div>
        <button id="add-sheet" title="Add sheet" class="icon-only"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <div class="spacer"></div>
        <div id="status"></div>
      </footer>
    </div>

    <div id="popover" class="popover" hidden></div>
    <div id="modal-backdrop" hidden><div id="modal" role="dialog" aria-modal="true"></div></div>
    <div id="toast" role="status" hidden></div>
    <div id="update-banner" role="status" hidden></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
